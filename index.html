<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VividSaver - Video & Photo Downloader</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fff0f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-top: 40px;
        }
        h1 {
            font-size: 2rem;
            color: #111;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .search-box {
            display: flex;
            background: #fff;
            border: 2px solid #e91e63;
            border-radius: 50px;
            padding: 5px 8px 5px 20px;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.15);
        }
        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
            background: transparent;
        }
        .search-box button {
            background: #e91e63;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .search-box button:hover {
            background: #c2185b;
        }
        #resultArea {
            margin-top: 30px;
            width: 100%;
        }
        .loading {
            display: none;
            font-weight: bold;
            color: #e91e63;
            margin-top: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-top: 20px;
        }
        .preview-media {
            max-width: 100%;
            border-radius: 10px;
            max-height: 350px;
            margin-bottom: 15px;
        }
        .download-btn {
            display: inline-block;
            background: #e91e63;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background: #c2185b;
        }
        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>All-in-One Video & Photo Downloader</h1>
        <p class="subtitle">Download videos, reels, photos from Instagram instantly for free.</p>

        <div class="search-box">
            <input type="text" id="mediaUrl" placeholder="Paste social media video or photo link here...">
            <button onclick="downloadMedia()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div id="loading" class="loading">
            <i class="fa-solid fa-spinner fa-spin"></i> প্রসেসিং হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...
        </div>

        <div id="resultArea"></div>
    </div>

    <script>
        async function downloadMedia() {
            const urlInput = document.getElementById('mediaUrl').value.trim();
            const resultArea = document.getElementById('resultArea');
            const loading = document.getElementById('loading');

            if (!urlInput) {
                alert('অনুগ্রহ করে একটি সঠিক লিংক পেস্ট করুন!');
                return;
            }

            resultArea.innerHTML = '';
            loading.style.display = 'block';

            // Render ব্যাকএন্ড এপিআই লিংক
            const backendApi = `https://vivid-media-downloader.onrender.com/api/download?url=${encodeURIComponent(urlInput)}`;

            try {
                const response = await fetch(backendApi);
                const data = await response.json();

                loading.style.display = 'none';

                if (data.status === 'success' && data.downloadUrl) {
                    let mediaHTML = '';
                    if (data.type === 'video') {
                        mediaHTML = `<video src="${data.downloadUrl}" controls class="preview-media"></video>`;
                    } else {
                        mediaHTML = `<img src="${data.downloadUrl}" class="preview-media" alt="Media Preview">`;
                    }

                    resultArea.innerHTML = `
                        <div class="card">
                            ${mediaHTML}
                            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #555;">${data.title || ''}</p>
                            <a href="${data.downloadUrl}" target="_blank" download class="download-btn">
                                <i class="fa-solid fa-download"></i> Download Media
                            </a>
                        </div>
                    `;
                } else {
                    resultArea.innerHTML = `<div class="error-msg">${data.error || 'ভিডিও লোড করা সম্ভব হয়নি। লিংকটি সঠিক কিনা চেক করুন।'}</div>`;
                }
            } catch (error) {
                loading.style.display = 'none';
                resultArea.innerHTML = `<div class="error-msg">সার্ভারে সংযোগ করা যাচ্ছে না। অনুগ্রহ করে একটু পর চেষ্টা করুন।</div>`;
            }
        }
    </script>
</body>
</html>
